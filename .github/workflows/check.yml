name: Check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Data file and generated pages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: pip install -r requirements.txt

      - name: Check duplicate links and generated pages
        run: python scripts/generate.py --check

    blurb: "Vetting bots, account security, scams, patches, and the home network."
  - id: money
    title: "Money and shopping"
    blurb: "Bills, insurance, shopping, and packages."
  - id: work
    title: "Work and tools"
    blurb: "Research, developer tools, and bots that manage other bots."

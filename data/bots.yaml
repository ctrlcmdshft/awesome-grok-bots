quick_start:
  - "[Spam-Call Scrubber (Arash)](bot:fUj6TYhiW_cjtzWvbsFgz) or [Call List Remover](bot:eGVcE2autG0u6UcAwE3py) + [Privacy Scrubber](bot:ZSQK72Iear_ykfnpTIOHQ) — highest impact for spam calls"
  - "[Data Deletion Bot](bot:ZvdSYibMw2oruiQX-3DSA) + [Unsubscribe Bot](bot:YJAP3CUaR3i5F2mhN69tM) / [Sub Killer](bot:t0j3bcp2AFpIuKxhmg-EN) — clean up years of signups"
  - "[Old Posts Auditor](bot:KPK89zuI30cV2Cz35s71s) or [Delete My Tweets!](bot:8xSL_TV4XPZZufWeQrgmv) — reduce historical exposure on X"
  - "[Bouncer](bot:o2OyTjWlNOUdYwr61prw_) or [Template Safety Checker](bot:8JbRKMaD-VrcN_QyitMXN) — vet any third-party bot link before you hit Add"
  - "[Remove Me](bot:qlDBDdHjGkHD9pka-9fRy) + [Junk Mail Stopper](bot:F1XZoNusJXMm92YTTT6kR) — data-broker removals plus physical junk mail, with rechecks"
  - "[Net Watch](bot:0vuunQUBFlb4SnStUCtLt) + [Patch Alert](bot:GJ6wSFte1rfQRD8oZVrpK) — home network map and monitor, plus alerts when software you run is actively exploited"
  - "[Bill Buster](bot:ji90nMN5S8qAPDtyVyjfi) + [Last Call](bot:YuGzbyI7jVfZedsRUOLCm) + [Claimed](bot:wIxb391-9pDKoWXQ8xrbD) — cut bills, stop trials before they charge, and find money you may be owed"
  - "[Script This Routine](bot:9E8iw2zlg2fTWzUT6RUsP) / [Burn Watch](bot:JEpich3S4Dlid1ACt3I6v) — keep a growing bot fleet from burning usage"
  - "[Tripwire](bot:XoYfr_5me3IicLxWfpP3n) + [UniFi Network Admin](bot:mFhBFJhKItbV4FyUl96Za) — alerts for software you actually run, and read-only daily health checks for people who use UniFi"


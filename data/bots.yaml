# Source of truth for Awesome Grok Bots.
#
# Append a bot under `bots:`, then run:
#   python scripts/generate.py
#
# Fields and how to suggest a bot: CONTRIBUTING.md
# Do not hand-edit README.md or categories/*.md.

groups:
  - id: privacy
    title: "Privacy and cleanup"
    blurb: "Removing personal data, stopping spam, cleaning inboxes, and shrinking an online footprint."
  - id: security
    title: "Security and home network"
    blurb: "Vetting bots, account security, scams, patches, and the home network."
  - id: money
    title: "Money and shopping"
    blurb: "Bills, insurance, shopping, and packages."
  - id: work
    title: "Work and tools"
    blurb: "Research, developer tools, and bots that manage other bots."
  - id: life
    title: "Home and life"
    blurb: "Home, health, travel, work, and everything else."

categories:
